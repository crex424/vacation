<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/vacation.css">
    <title>Vacation</title>
</head>
<body>
    <div id="header">
        <h1>Book Your Dream Vacation</h1>
    </div>

    <div id="main">
        <form id="vacation-form" action="#" method="post">
            <label for="destination">Destination</label>
            <select name="destination" id="destination">
                <option value="none">Choose a destination...</option>
                <option value="germany">Germany</option>
                <option value="japan">Japan</option>
                <option value="scotland">Scotland</option>
                <option value="uk">UK</option>
                <option value="austria">Austria</option>
            </select>
            <label for="departure-date">Departure Date</label>
            <input type="date" name="departure-date" id="departure-date">

            <label for="num-travelers">Number of Travelers</label>
            <input type="number" name="num-travelers" id="num-travelers">

            <div id="submit-btn">
                <button type="submit">Find My Vacation</button>
            </div>
        </form>
    </div>
</body>
</html>
